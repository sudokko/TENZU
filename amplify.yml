version: 1
# モノレポ構成: リポジトリ直下は設計書群、Next.js アプリは web/ 配下。
# Amplify Hosting に「App root = web」を伝え、web/ 配下でビルドさせる。
# /api/checkout・/api/stripe/webhook・/checkout/success は SSR（ƒ Dynamic）のため
# 静的エクスポートではなく Next.js SSR（compute）として配信される（Amplify が自動検出）。
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            # Next 16 / React 19 は新しめの Node を要求するため明示的に固定する
            - nvm use 20 || nvm install 20
            - npm ci
        build:
          commands:
            # Amplify コンソールの環境変数はビルドシェルには入るが、Next.js SSR ランタイム
            # （compute/Lambda）には自動で渡らない。ビルド時に .env.production へ書き出して
            # Next.js サーバーランタイムに読ませる（AWS 公式の SSR 向けワークアラウンド）。
            # マッチ無しでも grep の exit 1 でビルドを落とさないよう || true。
            # NEXT_PUBLIC_GTM_ID はビルド時にクライアントへ焼き込まれる（コンソール変数が
            # ビルドシェルに入っていれば効く）が、SSR 側の参照とも揃えるため whitelist に含める。
            - env | grep -E '^(STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|SITE_URL|SES_REGION|SES_FROM_EMAIL|SES_ACCESS_KEY_ID|SES_SECRET_ACCESS_KEY|AUTH_SECRET|NEXT_PUBLIC_GTM_ID|ADMIN_SECRET|ONSITE_TABLE|ONSITE_IMAGE_BUCKET|APP_AWS_ACCESS_KEY_ID|APP_AWS_SECRET_ACCESS_KEY|CONTACT_NOTIFY_EMAILS)=' >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*

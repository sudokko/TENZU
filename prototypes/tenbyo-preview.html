// ======================================================
// SVG描画
// ======================================================
function createMotifSVG(motif) {
  const w = (GRID_COLS - 1) * DOT_SPACING + MARGIN * 2;
  const h = (GRID_ROWS - 1) * DOT_SPACING + MARGIN * 2;

  let svg = `<svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<rect width="${w}" height="${h}" fill="white" stroke="#ddd" rx="4"/>`;

  // ドット描画
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      const x = MARGIN + c * DOT_SPACING;
      const y = MARGIN + r * DOT_SPACING;
      svg += `<circle cx="${x}" cy="${y}" r="${DOT_R}" fill="#333"/>`;
    }
  }

  // 線描画
  let lineCount = 0;
  let usedDots = new Set();
  for (const line of motif.lines) {
    const [from, to] = line;
    const x1 = MARGIN + from[0] * DOT_SPACING;
    const y1 = MARGIN + from[1] * DOT_SPACING;
    const x2 = MARGIN + to[0] * DOT_SPACING;
    const y2 = MARGIN + to[1] * DOT_SPACING;
    svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#333" stroke-width="2" stroke-linecap="round"/>`;
    lineCount++;
    usedDots.add(`${from[0]},${from[1]}`);
    usedDots.add(`${to[0]},${to[1]}`);
  }

  // 使用ドットをハイライト
  for (const dot of usedDots) {
    const [c, r] = dot.split(',').map(Number);
    const x = MARGIN + c * DOT_SPACING;
    const y = MARGIN + r * DOT_SPACING;
    svg += `<circle cx="${x}" cy="${y}" r="${DOT_R + 1.5}" fill="#e67e22"/>`;
  }

  svg += '</svg>';
  return { svg, lineCount, dotCount: usedDots.size };
}

function createEmptyGridSVG() {
  const w = (GRID_COLS - 1) * DOT_SPACING + MARGIN * 2;
  const h = (GRID_ROWS - 1) * DOT_SPACING + MARGIN * 2;
  let svg = `<svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<rect width="${w}" height="${h}" fill="white" stroke="#ddd" rx="4"/>`;
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      const x = MARGIN + c * DOT_SPACING;
      const y = MARGIN + r * DOT_SPACING;
      svg += `<circle cx="${x}" cy="${y}" r="${DOT_R}" fill="#333"/>`;
    }
  }
  svg += '</svg>';
  return svg;
}

// ======================================================
// ギャラリー生成
// ======================================================

let currentCategory = '';

for (const motif of motifs) {

    title.className = 'section-title';
    title.textContent = `📁 ${currentCategory}`;
    gallery.appendChild(title);
  }

  const { svg, lineCount, dotCount } = createMotifSVG(motif);
  const card = document.createElement('div');

<svg viewBox="0 0 720 512" xmlns="http://www.w3.org/2000/svg" role="img"><title>欠け補完 3×3 サンプル3問</title><desc>もんだい（欠けた図）とこたえ（完成図）を3問ぶん並べた図</desc><text x="180" y="60" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">もんだい（子に見せる図）</text><text x="370" y="60" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">こたえ（完成図）</text><text x="370" y="78" text-anchor="middle" font-size="11" fill="#D85A30">点線＝子が描き足す線</text><line x1="150" y1="112" x2="230" y2="112" stroke="#0F6E56" stroke-width="3.4"/><line x1="150" y1="192" x2="230" y2="192" stroke="#0F6E56" stroke-width="3.4"/><line x1="150" y1="112" x2="150" y2="192" stroke="#0F6E56" stroke-width="3.4"/><circle cx="150" cy="112" r="3" fill="#B4B2A9"/><circle cx="190" cy="112" r="3" fill="#B4B2A9"/><circle cx="230" cy="112" r="3" fill="#B4B2A9"/><circle cx="150" cy="152" r="3" fill="#B4B2A9"/><circle cx="190" cy="152" r="3" fill="#B4B2A9"/><circle cx="230" cy="152" r="3" fill="#B4B2A9"/><circle cx="150" cy="192" r="3" fill="#B4B2A9"/><circle cx="190" cy="192" r="3" fill="#B4B2A9"/><circle cx="230" cy="192" r="3" fill="#B4B2A9"/><line x1="280" y1="152" x2="310" y2="152" stroke="#5F5E5A" stroke-width="2.5"/><path d="M310 152 l-8 -5 v10 z" fill="#5F5E5A"/><line x1="340" y1="112" x2="420" y2="112" stroke="#0F6E56" stroke-width="3.4"/><line x1="340" y1="192" x2="420" y2="192" stroke="#0F6E56" stroke-width="3.4"/><line x1="340" y1="112" x2="340" y2="192" stroke="#0F6E56" stroke-width="3.4"/><line x1="420" y1="112" x2="420" y2="192" stroke="#D85A30" stroke-width="4" stroke-dasharray="1.5 5" stroke-linecap="round"/><circle cx="340" cy="112" r="3" fill="#B4B2A9"/><circle cx="380" cy="112" r="3" fill="#B4B2A9"/><circle cx="420" cy="112" r="3" fill="#B4B2A9"/><circle cx="340" cy="152" r="3" fill="#B4B2A9"/><circle cx="380" cy="152" r="3" fill="#B4B2A9"/><circle cx="420" cy="152" r="3" fill="#B4B2A9"/><circle cx="340" cy="192" r="3" fill="#B4B2A9"/><circle cx="380" cy="192" r="3" fill="#B4B2A9"/><circle cx=
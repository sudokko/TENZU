<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>3 種の点</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-tier3-sans);
  background: var(--bg);
  color: var(--fg);
  padding: 24px 28px;
  box-sizing: border-box;
}
.row { display: flex; gap: 16px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 8px; }
.mono { font-family: var(--font-tier3-mono); }
.klee { font-family: var(--font-tier1-klee); font-weight: 600; letter-spacing: 0.01em; }
.pencil { font-family: var(--font-tier2-pencil); letter-spacing: 0.01em; line-height: 1.85; }
.tag-cap { font-family: var(--font-tier3-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.token { font-family: var(--font-tier3-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.04em; }
.label-sm { font-family: var(--font-tier3-sans); font-size: 12px; color: var(--fg-2); }
.value-sm { font-family: var(--font-tier3-mono); font-size: 12px; color: var(--fg); }
</style></head><body>
<div class="col" style="gap:12px;">
  <div class="tag-cap">3 KINDS OF DOTS — 重ねないこと</div>
  <div class="row" style="gap:14px;">
    <div class="col" style="gap:6px;flex:1;">
      <div style="aspect-ratio:3/2;background:#fff;background-image:radial-gradient(circle,rgba(26,31,42,0.16) 1px,transparent 1px);background-size:14px 14px;border:1px solid var(--line-thin);border-radius:2px;"></div>
      <div class="value-sm">ブランド点格子</div>
      <div class="token" style="font-size:10px;">opacity 0.16 · system bg</div>
    </div>
    <div class="col" style="gap:6px;flex:1;">
      <div style="aspect-ratio:3/2;background:#fff;background-image:radial-gradient(circle,#1A1F2A 2px,transparent 2px);background-size:18px 18px;background-position:9px 9px;border:1px solid var(--line-thin);border-radius:2px;"></div>
      <div class="value-sm">商品点 (puzzle)</div>
      <div class="token" style="font-size:10px;">ベタ · PDF L1 のみ</div>
    </div>
    <div class="col" style="gap:6px;flex:1;">
      <div style="aspect-ratio:3/2;background:#fff;background-image:radial-gradient(circle,rgba(44,110,127,0.85) 1.5px,transparent 1.5px);background-size:18px 18px;background-position:11px 11px;border:1px solid var(--line-thin);border-radius:2px;"></div>
      <div class="value-sm">記入点 (子)</div>
      <div class="token" style="font-size:10px;">鉛筆任せ · L1 の上</div>
    </div>
  </div>
</div></body></html>

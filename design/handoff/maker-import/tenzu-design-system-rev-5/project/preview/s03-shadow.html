<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>Shadow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-tier3-sans);
  background: var(--bg);
  color: var(--fg);
  padding: 24px 28px;
  box-sizing: border-box;
}
.row { display: flex; gap: 16px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 8px; }
.mono { font-family: var(--font-tier3-mono); }
.klee { font-family: var(--font-tier1-klee); font-weight: 600; letter-spacing: 0.01em; }
.pencil { font-family: var(--font-tier2-pencil); letter-spacing: 0.01em; line-height: 1.85; }
.tag-cap { font-family: var(--font-tier3-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.token { font-family: var(--font-tier3-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.04em; }
.label-sm { font-family: var(--font-tier3-sans); font-size: 12px; color: var(--fg-2); }
.value-sm { font-family: var(--font-tier3-mono); font-size: 12px; color: var(--fg); }
</style></head><body>
<div class="col" style="gap:10px;">
  <div class="tag-cap">SHADOW — almost never. Lines do the work.</div>
  <div class="row" style="gap:16px; padding: 12px 0 16px;">
    <div class="col" style="gap:6px;flex:1;">
      <div style="aspect-ratio:3/1;background:#fff;border:1px solid var(--line-thin);border-radius:var(--radius-soft);"></div>
      <div class="value-sm">shadow-none</div>
      <div class="label-sm" style="font-size:11px;">既定 — 罫線で構造を作る</div>
    </div>
    <div class="col" style="gap:6px;flex:1;">
      <div style="aspect-ratio:3/1;background:#fff;border:1px solid var(--line-thin);border-radius:var(--radius-soft);box-shadow:0 1px 2px rgba(26,31,42,.04);"></div>
      <div class="value-sm">shadow-paper</div>
      <div class="label-sm" style="font-size:11px;">商品サムネのみ · 0 1px 2px 4%</div>
    </div>
  </div>
</div></body></html>

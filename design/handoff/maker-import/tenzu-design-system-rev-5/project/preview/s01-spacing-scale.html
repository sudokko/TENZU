<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-tier3-sans);
  background: var(--bg);
  color: var(--fg);
  padding: 24px 28px;
  box-sizing: border-box;
}
.row { display: flex; gap: 16px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 8px; }
.mono { font-family: var(--font-tier3-mono); }
.klee { font-family: var(--font-tier1-klee); font-weight: 600; letter-spacing: 0.01em; }
.pencil { font-family: var(--font-tier2-pencil); letter-spacing: 0.01em; line-height: 1.85; }
.tag-cap { font-family: var(--font-tier3-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.token { font-family: var(--font-tier3-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.04em; }
.label-sm { font-family: var(--font-tier3-sans); font-size: 12px; color: var(--fg-2); }
.value-sm { font-family: var(--font-tier3-mono); font-size: 12px; color: var(--fg); }
</style></head><body>
<div class="col" style="gap:10px;">
  <div class="tag-cap">SPACING — base 4px (rev.4 carry-over)</div>
  <div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end;">
    
      <div class="col" style="gap:4px;align-items:flex-start;">
        <div style="width:4px;height:24px;background:var(--fg);border-radius:1px;"></div>
        <div class="token" style="font-size:10px;">s-1</div>
        <div class="value-sm" style="font-size:10px;">4px</div>
      </div>
      <div class="col" style="gap:4px;align-items:flex-start;">
        <div style="width:8px;height:24px;background:var(--fg);border-radius:1px;"></div>
        <div class="token" style="font-size:10px;">s-2</div>
        <div class="value-sm" style="font-size:10px;">8px</div>
      </div>
      <div class="col" style="gap:4px;align-items:flex-start;">
        <div style="width:12px;height:24px;background:var(--fg);border-radius:1px;"></div>
        <div class="token" style="font-size:10px;">s-3</div>
        <div class="value-sm" style="font-size:10px;">12px</div>
      </div>
      <div class="col" style="gap:4px;align-items:flex-start;">
        <div style="width:16px;height:24px;background:var(--fg);border-radius:1px;"></div>
        <div class="token" style="font-size:10px;">s-4</div>
        <div class="value-sm" style="font-size:10px;">16px</div>
      </div>
      <div class="col" style="gap:4px;align-items:flex-start;">
        <div style="width:20px;height:24px;background:var(--fg);border-radius:1px;"></div>
        <div class="token" style="font-size:10px;">s-5</div>
        <div class="value-sm" style="font-size:10px;">20px</div>
      </div>
      <div class="col" style="gap:4px;align-items:flex-start;">
        <div style="width:24px;height:24px;background:var(--fg);border-radius:1px;"></div>
        <div class="token" style="font-size:10px;">s-6</div>
        <div class="value-sm" style="font-size:10px;">24px</div>
      </div>
      <div class="col" style="gap:4px;align-items:flex-start;">
        <div style="width:32px;height:24px;background:var(--fg);border-radius:1px;"></div>
        <div class="token" style="font-size:10px;">s-8</div>
        <div class="value-sm" style="font-size:10px;">32px</div>
      </div>
      <div class="col" style="gap:4px;align-items:flex-start;">
        <div style="width:40px;height:24px;background:var(--fg);border-radius:1px;"></div>
        <div class="token" style="font-size:10px;">s-10</div>
        <div class="value-sm" style="font-size:10px;">40px</div>
      </div>
      <div class="col" style="gap:4px;align-items:flex-start;">
        <div style="width:48px;height:24px;background:var(--fg);border-radius:1px;"></div>
        <div class="token" style="font-size:10px;">s-12</div>
        <div class="value-sm" style="font-size:10px;">48px</div>
      </div>
      <div class="col" style="gap:4px;align-items:flex-start;">
        <div style="width:64px;height:24px;background:var(--fg);border-radius:1px;"></div>
        <div class="token" style="font-size:10px;">s-16</div>
        <div class="value-sm" style="font-size:10px;">64px</div>
      </div>
      <div class="col" style="gap:4px;align-items:flex-start;">
        <div style="width:80px;height:24px;background:var(--fg);border-radius:1px;"></div>
        <div class="token" style="font-size:10px;">s-20</div>
        <div class="value-sm" style="font-size:10px;">80px</div>
      </div>
  </div>
  <div class="token" style="margin-top:4px;">page margin desktop 64 · mobile 24</div>
</div></body></html>

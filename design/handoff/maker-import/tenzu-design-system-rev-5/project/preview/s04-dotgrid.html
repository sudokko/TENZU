<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>Dot grid</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-tier3-sans);
  background: var(--bg);
  color: var(--fg);
  padding: 24px 28px;
  box-sizing: border-box;
}
.row { display: flex; gap: 16px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 8px; }
.mono { font-family: var(--font-tier3-mono); }
.klee { font-family: var(--font-tier1-klee); font-weight: 600; letter-spacing: 0.01em; }
.pencil { font-family: var(--font-tier2-pencil); letter-spacing: 0.01em; line-height: 1.85; }
.tag-cap { font-family: var(--font-tier3-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.token { font-family: var(--font-tier3-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.04em; }
.label-sm { font-family: var(--font-tier3-sans); font-size: 12px; color: var(--fg-2); }
.value-sm { font-family: var(--font-tier3-mono); font-size: 12px; color: var(--fg); }
</style></head><body>
<div class="col" style="gap:10px;">
  <div class="tag-cap">DOT GRID — system background</div>
  <div class="row" style="gap: 14px;">
    <div class="col" style="gap:6px;flex:1;">
      <div style="aspect-ratio:2/1;background:#fff;background-image:radial-gradient(circle, rgba(26,31,42,0.16) 1px, transparent 1px);background-size:24px 24px;border:1px solid var(--line-thin);border-radius:2px;"></div>
      <div class="value-sm">desktop / tablet</div>
      <div class="token">24px · opacity 0.16 · radius 1px</div>
    </div>
    <div class="col" style="gap:6px;flex:1;">
      <div style="aspect-ratio:2/1;background:#fff;background-image:radial-gradient(circle, rgba(26,31,42,0.16) 1px, transparent 1px);background-size:28px 28px;border:1px solid var(--line-thin);border-radius:2px;"></div>
      <div class="value-sm">mobile ≤ 600px</div>
      <div class="token">28px · opacity 0.16 · radius 1px</div>
    </div>
  </div>
  <div class="label-sm" style="font-size:11px;color:var(--fg-2);margin-top:4px;.no-dot-grid で局所解除 · PDF L1 作業面は載せない</div>
</div></body></html>

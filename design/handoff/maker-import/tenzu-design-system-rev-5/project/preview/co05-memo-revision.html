<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>Memo · 改訂履歴</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-tier3-sans);
  background: var(--bg);
  color: var(--fg);
  padding: 24px 28px;
  box-sizing: border-box;
}
.row { display: flex; gap: 16px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 8px; }
.mono { font-family: var(--font-tier3-mono); }
.klee { font-family: var(--font-tier1-klee); font-weight: 600; letter-spacing: 0.01em; }
.pencil { font-family: var(--font-tier2-pencil); letter-spacing: 0.01em; line-height: 1.85; }
.tag-cap { font-family: var(--font-tier3-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.token { font-family: var(--font-tier3-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.04em; }
.label-sm { font-family: var(--font-tier3-sans); font-size: 12px; color: var(--fg-2); }
.value-sm { font-family: var(--font-tier3-mono); font-size: 12px; color: var(--fg); }
</style></head><body>
<div class="col" style="gap:8px;">
  <div class="tag-cap">T2 · 改訂履歴 — dashed only · Plex Mono</div>
  <dl style="margin:0;padding:0;">
    
      <div style="display:grid;grid-template-columns:48px 84px 1fr;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line-thin);align-items:baseline;">
        <dt class="mono" style="font-size:13px;color:var(--fg);">v1.3</dt>
        <dd class="mono" style="font-size:11px;color:var(--fg-3);margin:0;letter-spacing:0.04em;">2026-05-12</dd>
        <dd style="font-family:var(--font-tier3-sans);font-size:13px;color:var(--fg-2);margin:0;line-height:1.65;">線太さを 0.5pt 増しました</dd>
      </div>
      <div style="display:grid;grid-template-columns:48px 84px 1fr;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line-thin);align-items:baseline;">
        <dt class="mono" style="font-size:13px;color:var(--fg);">v1.2</dt>
        <dd class="mono" style="font-size:11px;color:var(--fg-3);margin:0;letter-spacing:0.04em;">2026-04-30</dd>
        <dd style="font-family:var(--font-tier3-sans);font-size:13px;color:var(--fg-2);margin:0;line-height:1.65;">第 3 問の dot 配置を 1 段下げました</dd>
      </div>
      <div style="display:grid;grid-template-columns:48px 84px 1fr;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line-thin);align-items:baseline;">
        <dt class="mono" style="font-size:13px;color:var(--fg);">v1.1</dt>
        <dd class="mono" style="font-size:11px;color:var(--fg-3);margin:0;letter-spacing:0.04em;">2026-04-12</dd>
        <dd style="font-family:var(--font-tier3-sans);font-size:13px;color:var(--fg-2);margin:0;line-height:1.65;">親向け解説の段落を入れ替えました</dd>
      </div>
  </dl>
</div></body></html>

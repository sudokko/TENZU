<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>Product card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-tier3-sans);
  background: var(--bg);
  color: var(--fg);
  padding: 24px 28px;
  box-sizing: border-box;
}
.row { display: flex; gap: 16px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 8px; }
.mono { font-family: var(--font-tier3-mono); }
.klee { font-family: var(--font-tier1-klee); font-weight: 600; letter-spacing: 0.01em; }
.pencil { font-family: var(--font-tier2-pencil); letter-spacing: 0.01em; line-height: 1.85; }
.tag-cap { font-family: var(--font-tier3-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.token { font-family: var(--font-tier3-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.04em; }
.label-sm { font-family: var(--font-tier3-sans); font-size: 12px; color: var(--fg-2); }
.value-sm { font-family: var(--font-tier3-mono); font-size: 12px; color: var(--fg); }
</style></head><body>
<div class="col" style="gap:10px;">
  <div class="tag-cap">PRODUCT CARD — top + bottom dashed</div>
  <article style="border-top:1px dashed var(--line-thin);border-bottom:1px dashed var(--line-thin);padding:18px 0;display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:start;">
    <img src="../assets/icons/task-mirror.svg" style="width:64px;height:64px;border:1px solid var(--line-thin);border-radius:2px;">
    <div class="col" style="gap:4px;">
      <div class="mono" style="font-size:11px;color:var(--fg-2);letter-spacing:0.04em;">B · かたちを動かす · Lv.2</div>
      <div class="klee" style="font-size:18px;">線対称 Lv.2 — 4×4 まで</div>
      <div class="pencil" style="font-size:14px;color:var(--fg-2);">軸を見つけて、向こう側を描き起こす。</div>
      <div class="row" style="gap:14px;margin-top:6px;align-items:baseline;">
        <span class="mono" style="font-size:12px;color:var(--fg-2);">12 問</span>
        <span class="mono" style="font-size:13px;color:var(--fg);">¥200</span>
      </div>
    </div>
    <a style="font-family:var(--font-tier3-sans);font-weight:500;font-size:13px;color:var(--accent);align-self:end;text-decoration:none;">カートへ →</a>
  </article>
</div></body></html>

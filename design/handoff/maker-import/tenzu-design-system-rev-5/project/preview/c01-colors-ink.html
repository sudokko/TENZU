<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>Ink & Slate</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-tier3-sans);
  background: var(--bg);
  color: var(--fg);
  padding: 24px 28px;
  box-sizing: border-box;
}
.row { display: flex; gap: 16px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 8px; }
.mono { font-family: var(--font-tier3-mono); }
.klee { font-family: var(--font-tier1-klee); font-weight: 600; letter-spacing: 0.01em; }
.pencil { font-family: var(--font-tier2-pencil); letter-spacing: 0.01em; line-height: 1.85; }
.tag-cap { font-family: var(--font-tier3-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.token { font-family: var(--font-tier3-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.04em; }
.label-sm { font-family: var(--font-tier3-sans); font-size: 12px; color: var(--fg-2); }
.value-sm { font-family: var(--font-tier3-mono); font-size: 12px; color: var(--fg); }
</style></head><body>
<div class="col" style="gap: 12px;">
  <div class="tag-cap">INK & SLATE — Foreground scale</div>
  <div class="row" style="gap: 12px;">
    
      <div class="col" style="gap:6px;flex:1;">
        <div style="aspect-ratio:1;background:#1A1F2A;border-radius:2px;border:1px solid var(--line-thin);"></div>
        <div class="value-sm">fg</div>
        <div class="token">#1A1F2A</div>
        <div class="label-sm" style="font-size: 11px;">ink — body, headings</div>
      </div>
      <div class="col" style="gap:6px;flex:1;">
        <div style="aspect-ratio:1;background:#424955;border-radius:2px;border:1px solid var(--line-thin);"></div>
        <div class="value-sm">fg-2</div>
        <div class="token">#424955</div>
        <div class="label-sm" style="font-size: 11px;">secondary text</div>
      </div>
      <div class="col" style="gap:6px;flex:1;">
        <div style="aspect-ratio:1;background:#767D89;border-radius:2px;border:1px solid var(--line-thin);"></div>
        <div class="value-sm">fg-3</div>
        <div class="token">#767D89</div>
        <div class="label-sm" style="font-size: 11px;">meta · ≥18px</div>
      </div>
      <div class="col" style="gap:6px;flex:1;">
        <div style="aspect-ratio:1;background:#B0B5BD;border-radius:2px;border:1px solid var(--line-thin);"></div>
        <div class="value-sm">fg-4</div>
        <div class="token">#B0B5BD</div>
        <div class="label-sm" style="font-size: 11px;">lines only · no text</div>
      </div>
  </div>
</div></body></html>

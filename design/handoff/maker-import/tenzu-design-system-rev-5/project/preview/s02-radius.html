<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>Radius</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-tier3-sans);
  background: var(--bg);
  color: var(--fg);
  padding: 24px 28px;
  box-sizing: border-box;
}
.row { display: flex; gap: 16px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 8px; }
.mono { font-family: var(--font-tier3-mono); }
.klee { font-family: var(--font-tier1-klee); font-weight: 600; letter-spacing: 0.01em; }
.pencil { font-family: var(--font-tier2-pencil); letter-spacing: 0.01em; line-height: 1.85; }
.tag-cap { font-family: var(--font-tier3-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.token { font-family: var(--font-tier3-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.04em; }
.label-sm { font-family: var(--font-tier3-sans); font-size: 12px; color: var(--fg-2); }
.value-sm { font-family: var(--font-tier3-mono); font-size: 12px; color: var(--fg); }
</style></head><body>
<div class="col" style="gap:12px;">
  <div class="tag-cap">RADIUS — 4 values only</div>
  <div class="row" style="gap:14px;align-items:flex-start;">
    
      <div class="col" style="gap:6px;flex:1;">
        <div style="aspect-ratio:1;background:var(--bg-3);border:1px solid var(--line-thin);border-radius:0px;display:grid;place-items:center;">
          <span class="mono" style="font-size:13px;color:var(--fg);">0px</span>
        </div>
        <div class="value-sm">r-chrome</div>
        <div class="label-sm" style="font-size:11px;">chrome / header / dividers</div>
      </div>
      <div class="col" style="gap:6px;flex:1;">
        <div style="aspect-ratio:1;background:var(--bg-3);border:1px solid var(--line-thin);border-radius:2px;display:grid;place-items:center;">
          <span class="mono" style="font-size:13px;color:var(--fg);">2px</span>
        </div>
        <div class="value-sm">r-control</div>
        <div class="label-sm" style="font-size:11px;">input · iconbtn · small surface</div>
      </div>
      <div class="col" style="gap:6px;flex:1;">
        <div style="aspect-ratio:1;background:var(--bg-3);border:1px solid var(--line-thin);border-radius:4px;display:grid;place-items:center;">
          <span class="mono" style="font-size:13px;color:var(--fg);">4px</span>
        </div>
        <div class="value-sm">radius-soft</div>
        <div class="label-sm" style="font-size:11px;">cards · CTAs · memo · parents-warm</div>
      </div>
      <div class="col" style="gap:6px;flex:1;">
        <div style="aspect-ratio:1;background:var(--bg-3);border:1px solid var(--line-thin);border-radius:9999px;display:grid;place-items:center;">
          <span class="mono" style="font-size:13px;color:var(--fg);">9999px</span>
        </div>
        <div class="value-sm">r-token</div>
        <div class="label-sm" style="font-size:11px;">chips · tokens</div>
      </div>
  </div>
</div></body></html>

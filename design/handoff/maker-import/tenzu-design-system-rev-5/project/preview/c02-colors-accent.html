<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>Accent — Seiji teal</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-tier3-sans);
  background: var(--bg);
  color: var(--fg);
  padding: 24px 28px;
  box-sizing: border-box;
}
.row { display: flex; gap: 16px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 8px; }
.mono { font-family: var(--font-tier3-mono); }
.klee { font-family: var(--font-tier1-klee); font-weight: 600; letter-spacing: 0.01em; }
.pencil { font-family: var(--font-tier2-pencil); letter-spacing: 0.01em; line-height: 1.85; }
.tag-cap { font-family: var(--font-tier3-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.token { font-family: var(--font-tier3-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.04em; }
.label-sm { font-family: var(--font-tier3-sans); font-size: 12px; color: var(--fg-2); }
.value-sm { font-family: var(--font-tier3-mono); font-size: 12px; color: var(--fg); }
</style></head><body>
<div class="col" style="gap: 12px;">
  <div class="tag-cap">ACCENT — Seiji teal (locked from rev.4)</div>
  <div class="row" style="gap: 12px; align-items: stretch;">
    <div class="col" style="gap:6px; flex: 1.5;">
      <div style="aspect-ratio: 2/1; background:#2C6E7F; border-radius:2px; display:flex;align-items:flex-end;padding:8px;">
        <span style="color:#fff;font-family:var(--font-tier3-mono);font-size:11px;letter-spacing:0.04em;">WHITE 5.42 : 1</span>
      </div>
      <div class="value-sm">accent</div>
      <div class="token">#2C6E7F</div>
      <div class="label-sm" style="font-size:11px;">達成 · 到達 · 完成形のみ</div>
    </div>
    <div class="col" style="gap:6px;flex:1;">
      <div style="aspect-ratio:1;background:#D5E1E4;border-radius:2px;border:1px solid var(--line-thin);"></div>
      <div class="value-sm">accent-mute</div>
      <div class="token">#D5E1E4</div>
      <div class="label-sm" style="font-size:11px;">hover-track</div>
    </div>
    <div class="col" style="gap:6px;flex:1;">
      <div style="aspect-ratio:1;background:#1F5260;border-radius:2px;"></div>
      <div class="value-sm">accent-ink</div>
      <div class="token">#1F5260</div>
      <div class="label-sm" style="font-size:11px;">pressed</div>
    </div>
  </div>
</div></body></html>

<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>Type 禁則</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-tier3-sans);
  background: var(--bg);
  color: var(--fg);
  padding: 24px 28px;
  box-sizing: border-box;
}
.row { display: flex; gap: 16px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 8px; }
.mono { font-family: var(--font-tier3-mono); }
.klee { font-family: var(--font-tier1-klee); font-weight: 600; letter-spacing: 0.01em; }
.pencil { font-family: var(--font-tier2-pencil); letter-spacing: 0.01em; line-height: 1.85; }
.tag-cap { font-family: var(--font-tier3-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.token { font-family: var(--font-tier3-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.04em; }
.label-sm { font-family: var(--font-tier3-sans); font-size: 12px; color: var(--fg-2); }
.value-sm { font-family: var(--font-tier3-mono); font-size: 12px; color: var(--fg); }
</style></head><body>
<div class="col" style="gap:10px;">
  <div class="tag-cap">禁則 · これは使わない</div>
  
    <div class="row" style="gap:14px;padding:6px 10px;border:1px dashed #C04040;background:#FFF4F2;border-radius:2px;">
      <div class="klee" style="font-size:14px;color:var(--fg);min-width:200px;">14px Klee で長文を流す</div>
      <div style="font-family:var(--font-tier3-sans);font-size:11px;color:#8A2D2D;flex:1;">× <14px Klee で長文段落 → ストロークが潰れ、読書疲労</div>
    </div>
    <div class="row" style="gap:14px;padding:6px 10px;border:1px dashed #C04040;background:#FFF4F2;border-radius:2px;">
      <div class="pencil" style="font-size:14px;color:var(--fg);min-width:200px;">カートへ →</div>
      <div style="font-family:var(--font-tier3-sans);font-size:11px;color:#8A2D2D;flex:1;">× Pencil で CTA → 押せる感が消える</div>
    </div>
    <div class="row" style="gap:14px;padding:6px 10px;border:1px dashed #C04040;background:#FFF4F2;border-radius:2px;">
      <div class="klee" style="font-size:14px;color:var(--fg);min-width:200px;">12 問 / ¥200 / Lv.2</div>
      <div style="font-family:var(--font-tier3-sans);font-size:11px;color:#8A2D2D;flex:1;">× Klee で 12 問 ¥200 → 揃わない</div>
    </div>
    <div class="row" style="gap:14px;padding:6px 10px;border:1px dashed #C04040;background:#FFF4F2;border-radius:2px;">
      <div class="klee" style="font-size:14px;color:var(--fg);min-width:200px;">⚠ 5×5 以上は商品 PDF へ</div>
      <div style="font-family:var(--font-tier3-sans);font-size:11px;color:#8A2D2D;flex:1;">× Klee で ⚠ 警告 → 温度ミスマッチ</div>
    </div>
</div></body></html>

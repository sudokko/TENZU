<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>CTA · 4 tiers</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-tier3-sans);
  background: var(--bg);
  color: var(--fg);
  padding: 24px 28px;
  box-sizing: border-box;
}
.row { display: flex; gap: 16px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 8px; }
.mono { font-family: var(--font-tier3-mono); }
.klee { font-family: var(--font-tier1-klee); font-weight: 600; letter-spacing: 0.01em; }
.pencil { font-family: var(--font-tier2-pencil); letter-spacing: 0.01em; line-height: 1.85; }
.tag-cap { font-family: var(--font-tier3-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.token { font-family: var(--font-tier3-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.04em; }
.label-sm { font-family: var(--font-tier3-sans); font-size: 12px; color: var(--fg-2); }
.value-sm { font-family: var(--font-tier3-mono); font-size: 12px; color: var(--fg); }
</style></head><body>
<div class="col" style="gap:14px;">
  <div class="tag-cap">CTA — 4 段階</div>
  <div class="row" style="gap:14px;align-items:baseline;flex-wrap:wrap;">
    <div class="col" style="gap:4px;">
      <a style="font-family:var(--font-tier3-sans);font-weight:500;font-size:14px;color:var(--accent);text-decoration:none;letter-spacing:0.02em;">点描写とは →</a>
      <div class="token" style="font-size:10px;">btn-weak — link inline</div>
    </div>
    <div class="col" style="gap:4px;">
      <a style="display:inline-block;font-family:var(--font-tier3-sans);font-weight:500;font-size:14px;color:var(--fg);padding:9px 18px;background:var(--bg-3);border:1px solid var(--fg);border-radius:var(--radius-soft);letter-spacing:0.02em;">サンプルを見る</a>
      <div class="token" style="font-size:10px;">btn-medium — secondary</div>
    </div>
    <div class="col" style="gap:4px;">
      <a style="display:inline-block;font-family:var(--font-tier3-sans);font-weight:500;font-size:14px;color:#fff;background:var(--fg);padding:10px 20px;border-radius:var(--radius-soft);letter-spacing:0.02em;">サンプル PDF を見る →</a>
      <div class="token" style="font-size:10px;">btn-strong — primary</div>
    </div>
    <div class="col" style="gap:4px;">
      <a style="display:inline-block;font-family:var(--font-tier3-sans);font-weight:500;font-size:14px;color:#fff;background:var(--accent);padding:10px 20px;border-radius:var(--radius-soft);letter-spacing:0.02em;">カートへ →</a>
      <div class="token" style="font-size:10px;">btn-max — checkout / 達成</div>
    </div>
  </div>
</div></body></html>

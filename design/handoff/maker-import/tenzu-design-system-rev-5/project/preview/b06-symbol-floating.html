<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>Symbol · floating (corner-dot float)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; }
body { font-family: var(--font-tier3-sans); background: var(--bg); color: var(--fg); padding: 22px 24px; box-sizing: border-box; }
.col { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 14px; flex-wrap: wrap; }
.tag-cap { font-family: var(--font-tier3-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.value-sm { font-family: var(--font-tier3-mono); font-size: 11px; color: var(--fg); letter-spacing: 0.02em; }
.label-sm { font-family: var(--font-tier3-sans); font-size: 10px; color: var(--fg-2); line-height: 1.65; }
.stage { border-radius: 4px; padding: 14px; display: grid; place-items: center; aspect-ratio: 1; flex: 1; }
.stage img { width: 70%; height: 70%; object-fit: contain; display: block; }
.s-white  { background: #FFFFFF; border: 1px solid var(--line-thin); }
.s-cream  { background: #FAF8F3; border: 1px solid var(--line-thin); }
.s-fg     { background: #1A1F2A; border: 1px solid #1A1F2A; }
.s-accent { background: #2C6E7F; border: 1px solid #2C6E7F; }
.dot-bg { background: radial-gradient(circle, rgba(26,31,42,0.16) 1px, transparent 1px) 0 0 / 18px 18px, #FFFFFF; border: 1px solid var(--line-thin); }
</style></head><body>

<div class="col" style="gap:14px;">
  <div>
    <div class="tag-cap">SYMBOL · FLOATING — 4-dot square (corner-dot float)</div>
    <div class="label-sm" style="margin-top:6px;">隅 4 点が辺の線分に触れない「浮いた」構成。logo-regenerate-brief §2.1 で定義された rev.5 公式バリアント。「点と線がまだ繋がっていない」TENZU の物語を Symbol レベルで表現する。</div>
  </div>

  <div class="row">
    <div class="col" style="gap:6px;flex:1;">
      <div class="stage s-white"><img src="../assets/tenzu-symbol-floating-ink.png" alt="symbol floating"></div>
      <div class="value-sm">ink on white</div>
    </div>
    <div class="col" style="gap:6px;flex:1;">
      <div class="stage s-cream"><img src="../assets/tenzu-symbol-floating-ink.png" alt="symbol floating"></div>
      <div class="value-sm">ink on cream</div>
    </div>
    <div class="col" style="gap:6px;flex:1;">
      <div class="stage dot-bg"><img src="../assets/tenzu-symbol-floating-ink.png" alt="symbol floating"></div>
      <div class="value-sm">on dot grid</div>
    </div>
  </div>

  <div class="row">
    <div class="col" style="gap:6px;flex:1;">
      <div class="stage s-fg"><img src="../assets/tenzu-symbol-floating-cream.png" alt="symbol floating"></div>
      <div class="value-sm">cream on fg</div>
    </div>
    <div class="col" style="gap:6px;flex:1;">
      <div class="stage s-fg"><img src="../assets/tenzu-symbol-floating-white.png" alt="symbol floating"></div>
      <div class="value-sm">white on fg</div>
    </div>
    <div class="col" style="gap:6px;flex:1;">
      <div class="stage s-accent"><img src="../assets/tenzu-symbol-floating-white.png" alt="symbol floating"></div>
      <div class="value-sm">white on accent</div>
    </div>
  </div>

  <div class="row">
    <div class="col" style="gap:6px;flex:1;">
      <div class="stage s-white"><img src="../assets/tenzu-symbol-floating-teal.png" alt="symbol floating"></div>
      <div class="value-sm">teal on white</div>
    </div>
    <div class="col" style="gap:6px;flex:1;">
      <div class="stage s-cream"><img src="../assets/tenzu-symbol-floating-teal.png" alt="symbol floating"></div>
      <div class="value-sm">teal on cream</div>
    </div>
    <div class="col" style="gap:6px;flex:1;opacity:0;">spacer</div>
  </div>
</div>
</body></html>

<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>Contrast ratios</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-tier3-sans);
  background: var(--bg);
  color: var(--fg);
  padding: 24px 28px;
  box-sizing: border-box;
}
.row { display: flex; gap: 16px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 8px; }
.mono { font-family: var(--font-tier3-mono); }
.klee { font-family: var(--font-tier1-klee); font-weight: 600; letter-spacing: 0.01em; }
.pencil { font-family: var(--font-tier2-pencil); letter-spacing: 0.01em; line-height: 1.85; }
.tag-cap { font-family: var(--font-tier3-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.token { font-family: var(--font-tier3-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.04em; }
.label-sm { font-family: var(--font-tier3-sans); font-size: 12px; color: var(--fg-2); }
.value-sm { font-family: var(--font-tier3-mono); font-size: 12px; color: var(--fg); }
</style></head><body>
<div class="col" style="gap: 8px;">
  <div class="tag-cap">CONTRAST · WCAG ratios</div>
  
    <div class="row" style="gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line-thin);">
      <div style="background:#FFFFFF;color:#1A1F2A;padding:4px 12px;font-family:var(--font-tier3-mono);font-size:12px;border:1px solid var(--line-thin);border-radius:2px;min-width:120px;">fg / bg</div>
      <div class="mono" style="font-size:13px;color:var(--fg);min-width:60px;">16.93</div>
      <div class="label-sm" style="color:var(--accent);">AAA</div>
    </div>
    <div class="row" style="gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line-thin);">
      <div style="background:#FFFFFF;color:#424955;padding:4px 12px;font-family:var(--font-tier3-mono);font-size:12px;border:1px solid var(--line-thin);border-radius:2px;min-width:120px;">fg-2 / bg</div>
      <div class="mono" style="font-size:13px;color:var(--fg);min-width:60px;">9.45</div>
      <div class="label-sm" style="color:var(--accent);">AAA</div>
    </div>
    <div class="row" style="gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line-thin);">
      <div style="background:#FFFFFF;color:#767D89;padding:4px 12px;font-family:var(--font-tier3-mono);font-size:12px;border:1px solid var(--line-thin);border-radius:2px;min-width:120px;">fg-3 / bg</div>
      <div class="mono" style="font-size:13px;color:var(--fg);min-width:60px;">4.45</div>
      <div class="label-sm" style="color:var(--accent);">AA · ≥18px</div>
    </div>
    <div class="row" style="gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line-thin);">
      <div style="background:#FFFFFF;color:#2C6E7F;padding:4px 12px;font-family:var(--font-tier3-mono);font-size:12px;border:1px solid var(--line-thin);border-radius:2px;min-width:120px;">accent / bg</div>
      <div class="mono" style="font-size:13px;color:var(--fg);min-width:60px;">5.42</div>
      <div class="label-sm" style="color:var(--accent);">AA</div>
    </div>
    <div class="row" style="gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line-thin);">
      <div style="background:#1A1F2A;color:#FFFFFF;padding:4px 12px;font-family:var(--font-tier3-mono);font-size:12px;border:1px solid var(--line-thin);border-radius:2px;min-width:120px;">bg / fg</div>
      <div class="mono" style="font-size:13px;color:var(--fg);min-width:60px;">16.93</div>
      <div class="label-sm" style="color:var(--accent);">AAA</div>
    </div>
    <div class="row" style="gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line-thin);">
      <div style="background:#2C6E7F;color:#FFFFFF;padding:4px 12px;font-family:var(--font-tier3-mono);font-size:12px;border:1px solid var(--line-thin);border-radius:2px;min-width:120px;">bg / accent</div>
      <div class="mono" style="font-size:13px;color:var(--fg);min-width:60px;">5.42</div>
      <div class="label-sm" style="color:var(--accent);">AA</div>
    </div>
</div></body></html>
